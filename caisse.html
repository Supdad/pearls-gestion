<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse Pearl's</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 15px; height: 95vh; box-sizing: border-box; }
        
        /* BARRE DE NAVIGATION */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 25px; border-radius: 10px; border-bottom: 2px solid #00cccc; }
        .top-bar-title { font-size: 20px; font-weight: bold; color: #00cccc; letter-spacing: 2px; }
        .top-bar-user { margin-left: 20px; color: #aaa; font-size: 16px; font-weight: normal; }
        .btn-nav { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 10px; transition: 0.2s; font-size: 14px; }
        .btn-nav:hover { opacity: 0.8; }
        
        .main-content { display: flex; gap: 20px; flex: 1; overflow: hidden; }
        
        .menu-section { flex: 2; background: #1e1e1e; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
        .categories { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 10px; }
        .btn-cat { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .btn-cat.active { background: #00cccc; color: #111; }
        .produits { display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; align-content: flex-start; }
        .btn-prod { background: #2a2a2a; border: 1px solid #444; color: white; padding: 15px; border-radius: 8px; cursor: pointer; width: calc(33% - 10px); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; position: relative; }
        .btn-prod:hover { border-color: #00cccc; background: #333; }
        .prod-nom { font-weight: bold; margin-bottom: 5px; text-align: center; }
        .prod-prix { color: #00cccc; }
        .prod-stock { font-size: 12px; margin-top: 5px; font-weight: bold; padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,0.5); }
        
        .ticket-section { flex: 1; background: #1e1e1e; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; border-left: 4px solid #00cccc; }
        .ticket-header { text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; font-weight: bold; font-size: 18px; }
        .ticket-liste { flex: 1; overflow-y: auto; }
        .ticket-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; margin-bottom: 5px; border-radius: 5px; }
        .btn-remove { background: #ff4444; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 5px 10px; font-weight: bold; }
        .options-vente { background: #2a2a2a; padding: 15px; border-radius: 5px; margin-top: 10px; }
        .options-vente select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; background: #444; color: white; border: none; border-radius: 5px; font-size: 14px; }
        .ticket-total { font-size: 24px; text-align: center; padding: 15px; background: #111; border-radius: 5px; color: #00ff00; font-weight: bold; margin-top: 10px; }
        .btn-valider { width: 100%; padding: 15px; background: #00cccc; color: #111; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; transition: 0.2s; }
        .btn-valider:hover { background: #009999; }
        #loading { text-align: center; color: #00cccc; font-size: 18px; margin-top: 50px; }
        
        #modal-menu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #1e1e1e; padding: 25px; border-radius: 10px; border-top: 4px solid #00cccc; width: 350px; text-align: center; }
        .modal-box label { display: block; text-align: left; margin-top: 15px; color: #aaa; font-size: 14px; }
        .modal-box select { width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; margin-top: 5px; font-size: 16px; }
        .btn-modal-valider { background: #00cccc; color: #111; padding: 12px; width: 100%; margin-top: 20px; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-modal-annuler { background: transparent; color: #888; border: 1px solid #555; padding: 10px; width: 100%; margin-top: 10px; border-radius: 5px; cursor: pointer; }

        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 16px; font-weight: bold; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.4s ease-in-out, bottom 0.4s ease-in-out; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        #toast.success { border-bottom: 4px solid #00ff00; }
        #toast.error { border-bottom: 4px solid #ff4444; }
        #toast.warning { border-bottom: 4px solid #ffcc00; color: #ffcc00; }
    </style>
</head>
<body>

    <!-- BARRE DE NAVIGATION HAUTE -->
    <div class="top-bar">
        <div>
            <span class="top-bar-title">PEARL'S VENTE</span>
            <span class="top-bar-user" id="affichage-employe">👤 Employé : ...</span>
        </div>
        <div>
            <button class="btn-nav" style="background:#ff9900; color:#111;" onclick="allerEnCuisine()">🍳 ALLER EN CUISINE</button>
            <button class="btn-nav" style="background:#ff4444; color:#fff;" onclick="deconnexion()">🚪 DÉCONNEXION</button>
        </div>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <div class="main-content">
        <div class="menu-section">
            <div id="loading">Chargement du catalogue...</div>
            <div class="categories" id="categories-container" style="display: none;"></div>
            <div class="produits" id="produits-container" style="display: none;"></div>
        </div>

        <div class="ticket-section">
            <div class="ticket-header">TICKET EN COURS</div>
            <div class="ticket-liste" id="ticket-liste"></div>
            <div class="options-vente">
                <label>Paiement :</label>
                <select id="choix-paiement"><option>Espèces</option><option>Carte Bancaire</option></select>
                <label>Lieu (Influence les stocks) :</label>
                <select id="choix-lieu" onchange="rafraichirLieu()">
                    <option value="Cuisine/Resto">Restaurant</option>
                    <option value="Food Truck">Food Truck</option>
                    <option value="Livraison">Livraison</option>
                </select>
            </div>
            <div class="ticket-total">TOTAL : <span id="total-prix">0</span> $</div>
            <button class="btn-valider" id="btn-valider" onclick="validerCommande()">VALIDER LA COMMANDE</button>
        </div>
    </div>

    <div id="modal-menu">
        <div class="modal-box">
            <h3 id="modal-titre" style="color:#00cccc; margin-top:0;">Composition</h3>
            <div id="modal-choix"></div>
            <button class="btn-modal-valider" onclick="validerMenu()">AJOUTER</button>
            <button class="btn-modal-annuler" onclick="fermerModal()">ANNULER</button>
        </div>
    </div>

    <div id="toast">Message</div>

    <script>
        const urlWebScript = "https://script.google.com/macros/s/AKfycbzWazFTem8QxSrOi3Ie4nrI1yOUIqqdspd92UZtxdiY25G5K2GMkFVgrZOAXKkx4Bok/exec";
        
        const parametresUrl = new URLSearchParams(window.location.search);
        let nomEmploye = parametresUrl.get("nom") || "Inconnu";
        document.getElementById('affichage-employe').innerText = "👤 Employé : " + nomEmploye;

        // --- NAVIGATION ET DECONNEXION ---
        function allerEnCuisine() {
            window.location.href = "cuisine.html?nom=" + encodeURIComponent(nomEmploye);
        }

        function deconnexion() {
            afficherMessage("Déconnexion en cours...", "warning");
            const fd = new URLSearchParams();
            fd.append("action", "logout");
            fd.append("nom", nomEmploye);
            
            fetch(urlWebScript, { method: 'POST', body: fd }).then(() => {
                window.location.href = "index.html"; // Retour à la carte/vitrine
            }).catch(() => {
                window.location.href = "index.html"; // Retour même en cas d'erreur
            });
        }

        // LE RESTE DU CODE IDENTIQUE...
        let menuComplet = []; let panier = []; let menuEnCours = null; 

        const listeMenus = {
            "menu soft": { etapes: [{ titre: "Boisson", options: ["ice tea", "redbull", "limonade"] }, { titre: "Plat", options: "TOUS_LES_PLATS" }], fixes: ["frites"] },
            "menu gourmand": { etapes: [{ titre: "Plat", options: "TOUS_LES_PLATS" }, { titre: "Boisson", options: ["ice tea", "redbull", "limonade"] }, { titre: "Dessert", options: ["cookie", "pancakes", "fondant au chocolat"] }], fixes: [] },
            "menu alcool": { etapes: [{ titre: "Plat", options: "TOUS_LES_PLATS" }, { titre: "Alcool", options: ["vodka", "whisky", "martini blanc", "téquila", "rhum", "jägermeister"] }], fixes: [] },
            "menu grand large": { etapes: [{ titre: "Plat", options: ["merlan frit", "écrevisse"] }, { titre: "Boisson", options: ["ice tea", "redbull", "limonade"] }], fixes: [] },
            "menu rivage": { etapes: [{ titre: "Plat", options: ["huître", "crevettes", "bulots"] }, { titre: "Boisson", options: ["ice tea", "redbull", "limonade"] }], fixes: [] },
            "menu moussaillon": { etapes: [{ titre: "Boisson", options: ["ice tea", "redbull", "limonade"] }], fixes: ["morue"] }
        };

        function afficherMessage(msg, type = "success") {
            const toast = document.getElementById("toast"); toast.innerText = msg; toast.className = "show " + type;
            setTimeout(function() { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        window.onload = function() {
            const fd = new URLSearchParams(); fd.append("action", "getMenu");
            fetch(urlWebScript, { method: 'POST', body: fd }).then(r => r.json()).then(data => {
                if(data.statut === "succes") {
                    menuComplet = data.menu; document.getElementById('loading').style.display = 'none';
                    document.getElementById('categories-container').style.display = 'flex';
                    document.getElementById('produits-container').style.display = 'flex';
                    afficherCategories();
                }
            });
        };

        function rafraichirLieu() {
            if (panier.length > 0) { afficherMessage("Le changement de lieu a vidé le ticket.", "warning"); panier = []; mettreAJourTicket(); }
            const catActive = document.querySelector('.btn-cat.active');
            if (catActive) afficherProduits(catActive.innerText);
        }

        function afficherCategories() {
            const categories = [...new Set(menuComplet.map(p => p.categorie))];
            const catContainer = document.getElementById('categories-container'); catContainer.innerHTML = '';
            categories.forEach((cat, index) => {
                let btn = document.createElement('button'); btn.className = index === 0 ? 'btn-cat active' : 'btn-cat'; btn.innerText = cat;
                btn.onclick = function() { document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active')); btn.classList.add('active'); afficherProduits(cat); };
                catContainer.appendChild(btn);
            });
            if(categories.length > 0) { afficherProduits(categories[0]); }
        }

        function afficherProduits(categorieCible) {
            const prodContainer = document.getElementById('produits-container'); prodContainer.innerHTML = '';
            const prods = menuComplet.filter(p => p.categorie === categorieCible); const lieu = document.getElementById('choix-lieu').value;
            prods.forEach(prod => {
                let btn = document.createElement('button'); btn.className = 'btn-prod';
                let isMenu = Object.keys(listeMenus).find(k => k.toLowerCase() === prod.nom.toLowerCase());
                let htmlStock = "";
                if (isMenu) {
                    htmlStock = `<span class="prod-stock" style="color:#aaa;">Composer...</span>`; btn.onclick = function() { ouvrirModalMenu(isMenu, prod.prix); };
                } else {
                    let stockDispo = (lieu === "Food Truck") ? prod.stock_food_truck : prod.stock_cuisine;
                    if (stockDispo > 0) { htmlStock = `<span class="prod-stock" style="color:#00ff00;">Stock : ${stockDispo}</span>`; } else { htmlStock = `<span class="prod-stock" style="color:#ff4444;">RUPTURE</span>`; }
                    btn.onclick = function() { ajouterProduitFinal(prod.nom, prod.prix, [prod.nom]); };
                }
                btn.innerHTML = `<span class="prod-nom">${prod.nom}</span><span class="prod-prix">${prod.prix} $</span>${htmlStock}`;
                prodContainer.appendChild(btn);
            });
        }

        function ouvrirModalMenu(nomMenu, prix) {
            menuEnCours = { nom: nomMenu, prix: prix, config: listeMenus[nomMenu] }; document.getElementById("modal-titre").innerText = nomMenu.toUpperCase(); let htmlChoix = "";
            menuEnCours.config.etapes.forEach((etape, index) => {
                htmlChoix += `<label>${etape.titre}</label><select id="choix-menu-${index}">`;
                let optionsPossibles = etape.options === "TOUS_LES_PLATS" ? menuComplet.filter(p => p.categorie.toLowerCase().includes("plat")).map(p => p.nom) : etape.options;
                optionsPossibles.forEach(opt => { htmlChoix += `<option value="${opt}">${opt}</option>`; }); htmlChoix += `</select>`;
            });
            document.getElementById("modal-choix").innerHTML = htmlChoix; document.getElementById("modal-menu").style.display = "flex";
        }

        function fermerModal() { document.getElementById("modal-menu").style.display = "none"; menuEnCours = null; }

        function validerMenu() {
            let listePourStock = []; let resumeTicket = [];
            menuEnCours.config.etapes.forEach((etape, index) => { let choix = document.getElementById(`choix-menu-${index}`).value; listePourStock.push(choix); resumeTicket.push(choix); });
            if (menuEnCours.config.fixes) { menuEnCours.config.fixes.forEach(fixe => { listePourStock.push(fixe); }); }
            ajouterProduitFinal(`${menuEnCours.nom} (${resumeTicket.join(" + ")})`, menuEnCours.prix, listePourStock); fermerModal(); 
        }

        function ajouterProduitFinal(nomTicket, prix, elementsADeduire) {
            const lieu = document.getElementById('choix-lieu').value;
            for (let i = 0; i < elementsADeduire.length; i++) {
                let nomComposant = String(elementsADeduire[i]).trim().toLowerCase(); let prodInfo = menuComplet.find(p => String(p.nom).trim().toLowerCase() === nomComposant);
                if (!prodInfo) { afficherMessage(`⚠️ ERREUR : Produit [ ${elementsADeduire[i]} ] introuvable.`, "error"); return; }
                let stockMax = (lieu === "Food Truck") ? prodInfo.stock_food_truck : prodInfo.stock_cuisine; let qteDejaEnPanier = 0;
                panier.forEach(item => { item.articlesADeduire.forEach(art => { if (String(art).trim().toLowerCase() === nomComposant) qteDejaEnPanier += item.quantite; }); });
                if (qteDejaEnPanier >= stockMax) { afficherMessage(`❌ IMPOSSIBLE : [ ${prodInfo.nom.toUpperCase()} ] est en rupture !`, "error"); return; }
            }
            let articleExistant = panier.find(item => item.nom === nomTicket); if(articleExistant) { articleExistant.quantite++; } else { panier.push({ nom: nomTicket, prix: prix, quantite: 1, articlesADeduire: elementsADeduire }); }
            mettreAJourTicket();
        }

        function retirerDuPanier(index) { panier.splice(index, 1); mettreAJourTicket(); }

        function mettreAJourTicket() {
            const ticketListe = document.getElementById('ticket-liste'); ticketListe.innerHTML = ''; let total = 0;
            panier.forEach((item, index) => { let totalLigne = item.prix * item.quantite; total += totalLigne;
                let div = document.createElement('div'); div.className = 'ticket-item';
                div.innerHTML = `<span>${item.quantite}x ${item.nom}</span><span>${totalLigne}$ <button class="btn-remove" onclick="retirerDuPanier(${index})">X</button></span>`;
                ticketListe.appendChild(div);
            });
            document.getElementById('total-prix').innerText = total;
        }

        function validerCommande() {
            if(panier.length === 0) return afficherMessage("Le ticket est vide !", "warning");
            const btnValider = document.getElementById('btn-valider'); btnValider.innerText = "ENVOI EN COURS..."; btnValider.style.background = "#ffcc00";
            let resumeArticles = panier.map(item => `${item.quantite}x ${item.nom}`).join("\n");
            const fd = new URLSearchParams(); fd.append("action", "nouvelleVente"); fd.append("nom", nomEmploye); fd.append("articles", resumeArticles); fd.append("total", document.getElementById('total-prix').innerText); fd.append("paiement", document.getElementById('choix-paiement').value); fd.append("lieu", document.getElementById('choix-lieu').value); fd.append("panier", JSON.stringify(panier));
            fetch(urlWebScript, { method: 'POST', body: fd }).then(r => r.json()).then(data => {
                if(data.statut === "succes") { afficherMessage("✅ Vente enregistrée !", "success"); setTimeout(function() { window.location.reload(); }, 2000); }
            }).catch(() => { afficherMessage("❌ Erreur d'enregistrement", "error"); btnValider.innerText = "VALIDER LA COMMANDE"; btnValider.style.background = "#00cccc"; });
        }
    </script>
</body>
</html>
