<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl's - Caisse</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 25px; border-bottom: 2px solid #00cccc; }
        .top-bar-title { font-size: 20px; font-weight: bold; color: #00cccc; letter-spacing: 2px; }
        .top-bar-user { margin-left: 20px; color: #aaa; font-size: 16px; }
        .btn-nav { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 10px; transition: 0.2s; font-size: 14px; }
        .btn-nav:hover { opacity: 0.8; }

        .container { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }
        
        .left-panel { flex: 2; display: flex; flex-direction: column; background: #1e1e1e; border-radius: 10px; padding: 20px; overflow-y: auto; }
        .categories { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .cat-btn { background: #333; color: white; border: 1px solid #444; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .cat-btn:hover, .cat-btn.active { background: #00cccc; color: #111; border-color: #00cccc; }
        
        .produits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .produit-card { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #444; transition: transform 0.1s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; min-height: 100px; }
        .produit-card:hover { border-color: #00cccc; transform: scale(1.02); }
        .produit-nom { font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        .produit-prix { color: #00cccc; font-size: 18px; font-weight: bold; }
        .produit-stock { font-size: 12px; margin-top: 10px; color: #888; }
        .stock-vide { color: #ff4444 !important; font-weight: bold; }

        .right-panel { flex: 1; background: #1e1e1e; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
        
        .lieu-select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #00cccc; background: #121212; color: white; font-size: 16px; font-weight: bold; outline: none; }
        
        .panier-titre { font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; margin-bottom: 15px; color: #00cccc; }
        .panier-liste { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .panier-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .item-details { flex: 1; }
        .item-qte { font-weight: bold; color: #00cccc; margin-right: 10px; }
        
        .btn-offrir { background: #ffcc00; color: #111; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold; margin-right: 5px; font-size: 14px; }
        .btn-offrir:hover { background: #e6b800; }
        .btn-suppr { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .btn-suppr:hover { background: #cc0000; }

        .total-box { font-size: 24px; font-weight: bold; text-align: right; margin: 20px 0; color: white; border-top: 1px solid #333; padding-top: 20px; }
        
        .pay-buttons { display: flex; gap: 10px; }
        .btn-pay { flex: 1; padding: 15px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: #111; }
        .btn-especes { background: #00ff88; }
        .btn-especes:hover { background: #00cc6a; }
        .btn-carte { background: #00cccc; }
        .btn-carte:hover { background: #009999; }
        .btn-pay:disabled { background: #555; color: #888; cursor: not-allowed; }

        #loading { text-align: center; color: #00cccc; font-size: 18px; margin-top: 50px; }

        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 16px; font-weight: bold; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.4s ease-in-out, bottom 0.4s ease-in-out; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        #toast.success { border-bottom: 4px solid #00ff00; }
        #toast.error { border-bottom: 4px solid #ff4444; }
        #toast.warning { border-bottom: 4px solid #ffcc00; color: #111; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 25px; border-radius: 10px; border: 2px solid #00cccc; width: 400px; box-shadow: 0 0 20px rgba(0, 204, 204, 0.3); }
        .modal-content h2 { color: #00cccc; margin-top: 0; text-align: center; font-size: 22px; margin-bottom: 20px; }
        .modal-content label { display: block; color: #aaa; margin-bottom: 5px; font-size: 14px; }
        .modal-content select, .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 14px; box-sizing: border-box; }
        .info-menu { background: #2a2a2a; padding: 10px; border-radius: 5px; color: #00cccc; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <span class="top-bar-title">PEARL'S CAISSE</span>
            <span class="top-bar-user" id="affichage-employe">👤 Chargement...</span>
        </div>
        <div>
            <button class="btn-nav" style="background:#ff9900; color:#111;" onclick="allerEnCuisine()">🍳 CUISINE</button>
            <button class="btn-nav" style="background:#9933ff; color:#fff;" onclick="window.location.href='livraison.html?nom=' + encodeURIComponent(nomEmploye)">🚚 LOGISTIQUE</button>
            <button class="btn-nav" style="background:#ff4444; color:#fff;" onclick="deconnexion()">🚪 DÉCONNEXION</button>
        </div>
    </div>

    <div class="container">
        <div class="left-panel">
            <div id="loading">Chargement de la carte et des stocks...</div>
            <div class="categories" id="categories-container"></div>
            <div class="produits-grid" id="produits-container"></div>
        </div>

        <div class="right-panel">
            <select id="choix-lieu" class="lieu-select" onchange="rafraichirLieu()">
                <option value="Cuisine/Resto">Restaurant (Stock Cuisine + Bureau)</option>
                <option value="Salle Event">Salle de Réception</option>
                <option value="Food Truck">Food Truck</option>
                <option value="Bureau">Bureau</option>
                <option value="Livraison">Livraison (Aucun retrait de stock)</option>
            </select>

            <h2 class="panier-titre">🛒 PANIER ACTUEL</h2>
            <ul class="panier-liste" id="panier-liste"></ul>

            <div class="total-box">Total : <span id="prix-total">0</span>$</div>

            <div class="pay-buttons">
                <button class="btn-pay btn-especes" id="btn-esp" onclick="validerPaiement('Espèces')">ESPÈCES</button>
                <button class="btn-pay btn-carte" id="btn-cb" onclick="validerPaiement('Carte')">CARTE BANCAIRE</button>
            </div>
        </div>
    </div>

    <!-- POPUP COMPOSITION DE MENU -->
    <div id="modal-menu" class="modal">
        <div class="modal-content">
            <h2 id="modal-titre">COMPOSER MENU</h2>
            <div id="info-menu" class="info-menu"></div>
            
            <div id="container-plat">
                <label>Plat :</label>
                <select id="choix-plat"></select>
            </div>
            
            <div id="container-boisson">
                <label>Boisson :</label>
                <select id="choix-boisson"></select>
            </div>
            
            <div id="container-dessert" style="display:none;">
                <label>Dessert :</label>
                <select id="choix-dessert"></select>
            </div>
            
            <div id="container-qte" style="margin-top:10px; border-top:1px solid #444; padding-top:15px;">
                <label style="color:#00cccc; font-weight:bold;">Quantité (Menus identiques) :</label>
                <input type="number" id="choix-qte" min="1" value="1">
            </div>

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="fermerModal()" style="flex:1; padding:12px; background:#555; color:white; border:none; border-radius:5px; cursor:pointer;">Annuler</button>
                <button onclick="validerMenu()" style="flex:1; padding:12px; background:#00cccc; color:black; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Ajouter au panier</button>
            </div>
        </div>
    </div>

    <div id="toast">Message</div>

    <script>
        const urlWebScript = "https://script.google.com/macros/s/AKfycbzWazFTem8QxSrOi3Ie4nrI1yOUIqqdspd92UZtxdiY25G5K2GMkFVgrZOAXKkx4Bok/exec";
        
        let nomEmploye = new URLSearchParams(window.location.search).get("nom") || "Inconnu";
        let employeGrade = "Employé"; 
        
        let dbMenu = [];
        let panier = [];
        let categorieActuelle = "";
        let menuEnCoursDeComposition = null;

        function allerEnCuisine() { window.location.href = "cuisine.html?nom=" + encodeURIComponent(nomEmploye); }
        function deconnexion() {
            afficherMessage("Déconnexion...", "warning");
            fetch(urlWebScript, { method: 'POST', body: new URLSearchParams({action: "logout", nom: nomEmploye}) }).finally(() => window.location.href = "index.html");
        }
        function afficherMessage(msg, type = "success") {
            const toast = document.getElementById("toast"); toast.innerText = msg; toast.className = "show " + type;
            setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
        }

        window.onload = function() {
            const fd = new URLSearchParams({ action: "getMenu", nom: nomEmploye });
            fetch(urlWebScript, { method: 'POST', body: fd })
            .then(r => r.json()).then(data => {
                if(data.statut === "succes") {
                    dbMenu = data.menu;
                    employeGrade = data.grade || "Employé";
                    document.getElementById('affichage-employe').innerText = `👤 ${nomEmploye} (${employeGrade})`;
                    
                    document.getElementById('loading').style.display = 'none';
                    genererCategories();
                }
            });
        };

        function genererCategories() {
            const container = document.getElementById('categories-container');
            const ordreVoulu = ["menu", "plat_préparé", "soft", "dessert", "boissons chaudes", "alcool", "autre"];
            
            let categories = [...new Set(dbMenu.map(p => p.categorie))];
            categories.sort((a, b) => {
                let iA = ordreVoulu.indexOf(String(a).trim().toLowerCase()); let iB = ordreVoulu.indexOf(String(b).trim().toLowerCase());
                if(iA === -1) iA = 999; if(iB === -1) iB = 999;
                return iA - iB;
            });

            categories.forEach(cat => {
                let btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerText = cat.toUpperCase().replace("_", " ");
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    afficherProduits(cat);
                };
                container.appendChild(btn);
            });

            if(categories.length > 0) {
                container.firstChild.classList.add('active');
                afficherProduits(categories[0]);
            }
        }

        function rafraichirLieu() {
            if (categorieActuelle) afficherProduits(categorieActuelle);
            panier = []; majPanier();
        }

        function afficherProduits(categorie) {
            categorieActuelle = categorie;
            const container = document.getElementById('produits-container');
            const lieu = document.getElementById('choix-lieu').value;
            container.innerHTML = "";

            let produitsFiltres = dbMenu.filter(p => p.categorie === categorie);
            let isCategorieMenu = (categorie.toLowerCase().trim() === "menu");

            produitsFiltres.forEach(prod => {
                let stockDispo = 0;
                // Calcul fusionné pour le restaurant
                if (lieu === "Cuisine/Resto") {
                    stockDispo = (parseInt(prod.stock_cuisine) || 0) + (parseInt(prod.stock_bureau) || 0);
                } else if (lieu === "Food Truck") {
                    stockDispo = prod.stock_food_truck;
                } else if (lieu === "Salle Event") {
                    stockDispo = prod.stock_event;
                } else if (lieu === "Bureau") {
                    stockDispo = prod.stock_bureau;
                }

                let textStock = (lieu === "Livraison") ? "Stock non géré" : `En stock : ${stockDispo}`;
                if (isCategorieMenu) textStock = "Composé à la commande";
                
                let classStock = (!isCategorieMenu && stockDispo <= 0 && lieu !== "Livraison") ? "stock-vide" : "";
                
                let div = document.createElement('div');
                div.className = 'produit-card';
                div.innerHTML = `
                    <div class="produit-nom">${prod.nom.toUpperCase()}</div>
                    <div class="produit-prix">${prod.prix}$</div>
                    <div class="produit-stock ${classStock}">${textStock}</div>
                `;
                
                div.onclick = () => {
                    if (isCategorieMenu) {
                        ouvrirPopupMenu(prod);
                    } else if (stockDispo > 0 || lieu === "Livraison") {
                        ajouterAuPanier(prod, null, 1);
                    } else {
                        afficherMessage("Stock épuisé dans ce lieu !", "error");
                    }
                };
                container.appendChild(div);
            });
        }

        // --- GESTION INTELLIGENTE DU POPUP MENU ---
        function ouvrirPopupMenu(prod) {
            menuEnCoursDeComposition = prod;
            let nomMenu = prod.nom.toLowerCase().trim();
            document.getElementById("modal-titre").innerText = prod.nom.toUpperCase();
            document.getElementById("choix-qte").value = 1; 
            
            let selPlat = document.getElementById("choix-plat");
            let selBoisson = document.getElementById("choix-boisson");
            let selDessert = document.getElementById("choix-dessert");
            let infoBox = document.getElementById("info-menu");

            selPlat.innerHTML = "<option value=''>-- Choisir un Plat --</option>";
            selBoisson.innerHTML = "<option value=''>-- Choisir une Boisson --</option>";
            selDessert.innerHTML = "<option value=''>-- Choisir un Dessert --</option>";

            document.getElementById("container-plat").style.display = "block";
            document.getElementById("container-boisson").style.display = "block";
            document.getElementById("container-dessert").style.display = "none";
            infoBox.style.display = "none";

            let platsAutorises = [];
            let catBoissonRequise = "soft";
            let avecDessert = false;
            menuEnCoursDeComposition.articlesForces = []; 

            if (nomMenu.includes("soft")) {
                menuEnCoursDeComposition.articlesForces.push("frites");
                infoBox.innerHTML = "🍟 Une barquette de Frites sera incluse automatiquement.";
                infoBox.style.display = "block";
            } 
            else if (nomMenu.includes("alcool")) {
                menuEnCoursDeComposition.articlesForces.push("frites");
                catBoissonRequise = "alcool";
                infoBox.innerHTML = "🍟 Une barquette de Frites sera incluse automatiquement.";
                infoBox.style.display = "block";
            } 
            else if (nomMenu.includes("gourmand")) {
                avecDessert = true;
                document.getElementById("container-dessert").style.display = "block";
            } 
            else if (nomMenu.includes("grand large")) {
                platsAutorises = ["merlan frit", "écrevisse"];
            } 
            else if (nomMenu.includes("rivage")) {
                platsAutorises = ["crevettes", "bulots", "huître", "huitre"];
            } 
            else if (nomMenu.includes("moussaillon")) {
                platsAutorises = ["morue"];
            }

            const lieu = document.getElementById('choix-lieu').value;

            dbMenu.forEach(p => {
                let stockDispo = 0;
                // Calcul fusionné pour le restaurant à l'intérieur du popup aussi !
                if (lieu === "Cuisine/Resto") {
                    stockDispo = (parseInt(p.stock_cuisine) || 0) + (parseInt(p.stock_bureau) || 0);
                } else if (lieu === "Food Truck") {
                    stockDispo = p.stock_food_truck;
                } else if (lieu === "Salle Event") {
                    stockDispo = p.stock_event;
                } else if (lieu === "Bureau") {
                    stockDispo = p.stock_bureau;
                }

                let infoRupture = (stockDispo <= 0 && lieu !== "Livraison") ? " ⚠️(Rupture)" : "";
                let cat = p.categorie.toLowerCase().trim();
                let nomP = p.nom.toLowerCase().trim();
                let optionHTML = `<option value="${p.nom}">${p.nom}${infoRupture}</option>`;

                if (cat.includes("plat") && nomP !== "frites") {
                    if (platsAutorises.length === 0 || platsAutorises.includes(nomP)) {
                        selPlat.innerHTML += optionHTML;
                    }
                }
                if (cat === catBoissonRequise) {
                    selBoisson.innerHTML += optionHTML;
                }
                if (avecDessert && cat.includes("dessert")) {
                    selDessert.innerHTML += optionHTML;
                }
            });

            document.getElementById("modal-menu").style.display = "flex";
        }

        function fermerModal() {
            document.getElementById("modal-menu").style.display = "none";
            menuEnCoursDeComposition = null;
        }

        function validerMenu() {
            let plat = document.getElementById("choix-plat").value;
            let boisson = document.getElementById("choix-boisson").value;
            let dessert = document.getElementById("choix-dessert").value;
            let requiresDessert = document.getElementById("container-dessert").style.display !== "none";
            let qteDemandee = parseInt(document.getElementById("choix-qte").value) || 1;

            if (!plat || !boisson || (requiresDessert && !dessert)) {
                afficherMessage("Veuillez sélectionner toutes les options du menu !", "warning");
                return;
            }

            let composition = [plat, boisson];
            if (requiresDessert) composition.push(dessert);

            if (menuEnCoursDeComposition.articlesForces) {
                menuEnCoursDeComposition.articlesForces.forEach(forceNom => {
                    let exactItem = dbMenu.find(p => p.nom.toLowerCase().trim() === forceNom);
                    if (exactItem) composition.push(exactItem.nom);
                });
            }

            ajouterAuPanier(menuEnCoursDeComposition, composition, qteDemandee);
            fermerModal();
        }

        // --- GESTION PANIER ---
        function ajouterAuPanier(produit, composition = null, quantiteAjoutee = 1) {
            let cleUnique = produit.nom;
            let texteComposition = "";
            
            if (composition) {
                cleUnique += "_" + composition.join("_");
                texteComposition = `<br><small style="color:#00cccc;">(${composition.join(' + ')})</small>`;
            }

            let item = panier.find(p => p.cle === cleUnique);
            if (item) { 
                item.quantite += quantiteAjoutee; 
            } else { 
                panier.push({ 
                    cle: cleUnique,
                    nom: produit.nom, 
                    prix: produit.prix, 
                    quantite: quantiteAjoutee, 
                    articlesADeduire: composition ? composition : [produit.nom],
                    affichage: texteComposition
                }); 
            }
            majPanier();
        }

        function retirerDuPanier(index) {
            panier.splice(index, 1);
            majPanier();
        }

        // --- FONCTION OFFRIR ---
        function offrirArticle(index) {
            panier[index].prix = 0;
            panier[index].affichage = (panier[index].affichage || "") + ' <br><span style="color:#00ff88; font-weight:bold;">[OFFERT]</span>';
            majPanier();
        }

        function majPanier() {
            const liste = document.getElementById('panier-liste');
            let total = 0;
            liste.innerHTML = "";

            let rolesPouvantOffrir = ["gérant", "gerant", "co-gérant", "co-gerant", "manager"];
            let gradeActuelPropre = employeGrade.toLowerCase().trim();
            let estAutoriseAOffrir = rolesPouvantOffrir.includes(gradeActuelPropre);

            panier.forEach((item, index) => {
                total += (item.prix * item.quantite);
                
                let btnOffrirHTML = "";
                if (estAutoriseAOffrir && item.prix > 0) {
                    btnOffrirHTML = `<button class="btn-offrir" onclick="offrirArticle(${index})" title="Offrir ce produit">🎁</button>`;
                }

                liste.innerHTML += `
                    <li class="panier-item">
                        <div class="item-details">
                            <span class="item-qte">${item.quantite}x</span>
                            <span>${item.nom} ${item.affichage || ""}</span>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <div style="margin-right: 15px; font-weight: bold;">${item.prix * item.quantite}$</div>
                            ${btnOffrirHTML}
                            <button class="btn-suppr" onclick="retirerDuPanier(${index})">X</button>
                        </div>
                    </li>
                `;
            });
            document.getElementById('prix-total').innerText = total;
            let payBtnDisabled = panier.length === 0;
            document.getElementById('btn-esp').disabled = payBtnDisabled;
            document.getElementById('btn-cb').disabled = payBtnDisabled;
        }

        function validerPaiement(moyen) {
            if (panier.length === 0) return;

            document.getElementById('btn-esp').disabled = true;
            document.getElementById('btn-cb').disabled = true;
            document.getElementById('btn-esp').innerText = "ENVOI...";

            let articlesStr = panier.map(p => p.quantite + "x " + p.nom).join(", ");
            let totalVal = document.getElementById('prix-total').innerText;
            let lieuVal = document.getElementById('choix-lieu').value;

            const fd = new URLSearchParams();
            fd.append("action", "nouvelleVente");
            fd.append("nom", nomEmploye);
            fd.append("articles", articlesStr);
            fd.append("total", totalVal);
            fd.append("paiement", moyen);
            fd.append("lieu", lieuVal);
            fd.append("panier", JSON.stringify(panier));

            fetch(urlWebScript, { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                if(data.statut === "succes") {
                    afficherMessage("✅ Vente enregistrée !", "success");
                    panier = []; majPanier();
                    const fdRefresh = new URLSearchParams({ action: "getMenu", nom: nomEmploye });
                    fetch(urlWebScript, { method: 'POST', body: fdRefresh })
                    .then(r => r.json()).then(newData => { dbMenu = newData.menu; rafraichirLieu(); });
                }
            })
            .finally(() => {
                document.getElementById('btn-esp').innerText = "ESPÈCES";
            });
        }
    </script>
</body>
</html>
