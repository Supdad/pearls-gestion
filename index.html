<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl's - La Carte</title>
    <style>
        :root { --accent: #00cccc; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; margin: 0; padding: 0; }
        
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1551963831-b3b1ca40c98e?auto=format&fit=crop&w=1200&q=80'); background-size: cover; background-position: center; padding: 60px 20px; text-align: center; border-bottom: 3px solid var(--accent); }
        header h1 { margin: 0; font-size: 48px; letter-spacing: 5px; color: var(--accent); text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        header p { font-style: italic; color: #ccc; margin-top: 10px; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; padding-bottom: 100px; }
        
        .category-title { border-left: 5px solid var(--accent); padding-left: 15px; margin: 40px 0 20px 0; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: var(--card); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; transition: 0.3s; cursor: default; }
        .menu-item:hover { border-color: var(--accent); transform: translateY(-2px); background: #222; }
        
        .item-info { display: flex; flex-direction: column; flex: 1; padding-right: 15px; }
        .item-nom { font-weight: bold; text-transform: capitalize; transition: color 0.3s; }
        .menu-item:hover .item-nom { color: var(--accent); }
        
        .item-prix { color: var(--accent); font-weight: bold; font-size: 18px; white-space: nowrap; }

        .menu-composition { font-size: 12px; color: #aaa; font-style: italic; max-height: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease; }
        .menu-item:hover .menu-composition { max-height: 40px; opacity: 1; margin-top: 5px; }

        .staff-portal { margin-top: 80px; padding: 30px; border-radius: 10px; background: #000; border: 1px dashed #444; text-align: center; }
        .staff-portal h3 { color: #666; font-size: 14px; margin-bottom: 20px; text-transform: uppercase; }
        .btn-staff { display: inline-block; padding: 10px 20px; margin: 5px; border: 1px solid #444; color: #888; text-decoration: none; border-radius: 5px; font-size: 13px; transition: 0.3s; }
        .btn-staff:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,204,204,0.05); }

        #loading { text-align: center; padding: 50px; color: var(--accent); }
        
        @media (max-width: 600px) { .menu-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>PEARL'S</h1>
        <p>Les saveurs de l'océan, au cœur de la ville.</p>
    </header>

    <div class="container">
        <div id="loading">Consultation de la carte en cours...</div>
        <div id="menu-content"></div>

        <div class="staff-portal">
            <h3>Espace Salariés</h3>
            <a href="login.html?target=caisse" class="btn-staff">Accès Caisse</a>
            <a href="login.html?target=cuisine" class="btn-staff">Table de Préparation</a>
        </div>
    </div>

    <script>
        const urlWebScript = "https://script.google.com/macros/s/AKfycbzWazFTem8QxSrOi3Ie4nrI1yOUIqqdspd92UZtxdiY25G5K2GMkFVgrZOAXKkx4Bok/exec";

        const listeMenusClient = {
            "menu soft": { etapes: ["1x Boisson", "1x Plat"], fixes: ["Frites"] },
            "menu gourmand": { etapes: ["1x Plat", "1x Boisson", "1x Dessert"], fixes: [] },
            "menu alcool": { etapes: ["1x Plat", "1x Alcool"], fixes: [] },
            "menu grand large": { etapes: ["1x Plat (Merlan frit ou Écrevisse)", "1x Boisson"], fixes: [] },
            "menu rivage": { etapes: ["1x Plat (Huître, Crevettes ou Bulots)", "1x Boisson"], fixes: [] },
            "menu moussaillon": { etapes: ["1x Boisson"], fixes: ["Morue"] }
        };

        window.onload = function() {
            const fd = new URLSearchParams(); 
            fd.append("action", "getMenu");

            fetch(urlWebScript, { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                if(data.statut === "succes") {
                    document.getElementById('loading').style.display = 'none';
                    afficherCarte(data.menu);
                }
            });
        };

        function afficherCarte(menu) {
            const container = document.getElementById('menu-content');
            let categories = [...new Set(menu.map(p => p.categorie))];

            // --- LA NOUVEAUTÉ EST ICI : L'ORDRE D'AFFICHAGE ---
            // On définit l'ordre voulu en minuscules. 
            const ordreVoulu = [
                "menu", 
                "plat", 
                "soft", 
                "dessert", 
                "boisson chaude", 
                "alcool"
            ];

            // On trie les catégories trouvées selon notre liste
            categories.sort((a, b) => {
                let indexA = ordreVoulu.indexOf(String(a).trim().toLowerCase());
                let indexB = ordreVoulu.indexOf(String(b).trim().toLowerCase());
                
                // Si tu ajoutes une catégorie inconnue un jour, elle ira tout en bas (999)
                if (indexA === -1) indexA = 999;
                if (indexB === -1) indexB = 999;
                
                return indexA - indexB;
            });

            // Affichage de la carte triée
            categories.forEach(cat => {
                let section = document.createElement('div');
                section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
                
                let grid = document.createElement('div');
                grid.className = 'menu-grid';
                
                const items = menu.filter(p => p.categorie === cat);
                items.forEach(item => {
                    let nomNettoye = String(item.nom).trim().toLowerCase();
                    let infoMenu = listeMenusClient[nomNettoye];
                    let htmlComposition = "";
                    
                    if (infoMenu) {
                        let contenu = [];
                        if (infoMenu.etapes.length > 0) { contenu = contenu.concat(infoMenu.etapes); }
                        if (infoMenu.fixes.length > 0) { contenu = contenu.concat(infoMenu.fixes); }
                        htmlComposition = `<div class="menu-composition">${contenu.join(" + ")}</div>`;
                    }

                    grid.innerHTML += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-nom">${item.nom}</span>
                                ${htmlComposition}
                            </div>
                            <span class="item-prix">${item.prix}$</span>
                        </div>
                    `;
                });
                
                section.appendChild(grid);
                container.appendChild(section);
            });
        }
    </script>
</body>
</html>
